<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎲 RPG LLM Adventure</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --terminal-bg: #000000;
            --terminal-green: #33ff33;
            --terminal-bright: #00ff41;
            --terminal-dark: #0a0a0a;
            --terminal-dim: #1a801a;
            --glow: 0 0 5px rgba(51, 255, 51, 0.5), 0 0 10px rgba(51, 255, 51, 0.3);
            --glow-intense: 0 0 10px rgba(51, 255, 51, 0.8), 0 0 20px rgba(51, 255, 51, 0.5);
        }
        body {
            font-family: 'VT323', monospace;
            background-color: #000;
            color: var(--terminal-green);
            min-height: 100vh;
            padding: 1rem;
            line-height: 1.2;
            overflow-x: hidden;
            text-shadow: var(--glow);
        }
        .book-container {
            max-width: 900px;
            margin: 0 auto;
            background: var(--terminal-bg);
            border: 2px solid var(--terminal-dim);
            border-radius: 20px;
            box-shadow: 0 0 20px rgba(51, 255, 51, 0.2);
            position: relative;
            overflow: hidden;
            animation: flicker 0.15s infinite;
        }
        .book-container::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 10;
        }
        .book-container::after {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(ellipse at center, rgba(0,0,0,0) 0%, rgba(0,0,0,0.2) 100%);
            pointer-events: none;
            z-index: 11;
        }
        @keyframes flicker {
            0% { opacity: 0.98; }
            50% { opacity: 1; }
            100% { opacity: 0.99; }
        }
        .header {
            background: var(--terminal-bg);
            color: var(--terminal-bright);
            padding: 2rem 1.5rem;
            text-align: center;
            border-bottom: 1px solid var(--terminal-green);
            position: relative;
        }
        .header::after { display: none; }
        h1 {
            font-family: 'VT323', monospace;
            font-size: clamp(2rem, 6vw, 4rem);
            font-weight: normal;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            text-shadow: var(--glow-intense);
            margin-bottom: 0.5rem;
        }
        .subtitle {
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: var(--terminal-dim);
        }
        .content { padding: 2rem 1.5rem; position: relative; z-index: 1; }
        .section { margin-bottom: 2rem; animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .section-title {
            font-family: 'VT323', monospace;
            font-size: 1.8rem;
            color: var(--terminal-bright);
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid var(--terminal-green);
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }
        .form-group { margin-bottom: 1.5rem; }
        label {
            display: block;
            font-family: 'VT323', monospace;
            margin-bottom: 0.5rem;
            color: var(--terminal-green);
            font-size: 1.2rem;
            text-transform: uppercase;
        }
        input, select, textarea {
            width: 100%;
            padding: 0.75rem;
            background: var(--terminal-dark);
            border: 1px solid var(--terminal-green);
            border-radius: 0;
            font-family: 'VT323', monospace;
            font-size: 1.2rem;
            color: var(--terminal-green);
            transition: all 0.2s ease;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--terminal-bright);
            box-shadow: 0 0 10px rgba(51, 255, 51, 0.4);
            background: #111;
        }
        ::placeholder { color: var(--terminal-dim); opacity: 0.7; }
        textarea { resize: vertical; min-height: 80px; }
        .btn {
            font-family: 'VT323', monospace;
            padding: 1rem 2rem;
            background: transparent;
            color: var(--terminal-green);
            border: 1px solid var(--terminal-green);
            border-radius: 4px;
            cursor: pointer;
            font-size: 1.4rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            transition: all 0.2s ease;
            width: 100%;
            text-shadow: var(--glow);
            position: relative;
        }
        .btn:hover {
            background: rgba(51, 255, 51, 0.1);
            box-shadow: 0 0 15px rgba(51, 255, 51, 0.3);
            color: var(--terminal-bright);
            border-color: var(--terminal-bright);
        }
        .btn:active { background: rgba(51, 255, 51, 0.2); }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; border-color: var(--terminal-dim); color: var(--terminal-dim); }
        .narrative {
            background: var(--terminal-dark);
            padding: 1.5rem;
            border-left: 2px solid var(--terminal-green);
            margin-bottom: 2rem;
            font-size: 1.3rem;
            line-height: 1.4;
            text-align: left;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }
        .narrative::first-letter { font-size: inherit; font-weight: inherit; float: none; line-height: inherit; margin-right: 0; color: inherit; font-family: inherit; }
        .options { display: grid; gap: 1rem; margin-bottom: 2rem; }
        .option-btn {
            background: transparent;
            border: 1px solid var(--terminal-green);
            padding: 1rem;
            text-align: left;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: 'VT323', monospace;
            font-size: 1.2rem;
            color: var(--terminal-green);
            position: relative;
        }
        .option-btn:hover {
            background: rgba(51, 255, 51, 0.1);
            border-color: var(--terminal-bright);
            transform: translateX(5px);
            box-shadow: 0 0 10px rgba(51, 255, 51, 0.2);
        }
        .option-text { margin-left: 0.5rem; }
        .custom-action input {
            border-right: 8px solid var(--terminal-green);
            animation: blink-cursor 0.8s step-end infinite;
        }
        @keyframes blink-cursor { from, to { border-right-color: transparent; } 50% { border-right-color: var(--terminal-green); } }
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem;
            background: var(--terminal-dark);
            border: 1px solid var(--terminal-green);
            border-radius: 4px;
            margin-bottom: 2rem;
            font-family: 'VT323', monospace;
            font-size: 1.2rem;
        }
        .round-counter { color: var(--terminal-bright); }
        .loading { text-align: center; padding: 2rem; color: var(--terminal-green); }
        .spinner {
            border: 2px solid var(--terminal-dark);
            border-top: 2px solid var(--terminal-bright);
            border-radius: 50%;
            width: 40px; height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
            box-shadow: 0 0 10px rgba(51, 255, 51, 0.3);
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .footer {
            text-align: center;
            padding: 1.5rem;
            color: var(--terminal-dim);
            font-size: 1rem;
            border-top: 1px solid var(--terminal-green);
            background: var(--terminal-bg);
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }
        .hidden { display: none; }
        .mt-2 { margin-top: 2rem; }
        .mb-2 { margin-bottom: 2rem; }
        @media (max-width: 640px) {
            body { padding: 0.5rem; }
            .content { padding: 1.5rem 1rem; }
            .header { padding: 1.5rem 1rem; }
            h1 { font-size: 2.5rem; }
            .section-title { font-size: 1.5rem; }
            .narrative { font-size: 1.1rem; padding: 1rem; }
            .option-btn { padding: 0.8rem; }
        }
        .success-msg {
            background: rgba(51, 255, 51, 0.05);
            border: 1px solid var(--terminal-green);
            color: var(--terminal-bright);
            padding: 1rem;
            border-radius: 4px;
            margin-bottom: 1rem;
            text-align: center;
            font-size: 1.2rem;
        }
        .download-link {
            display: inline-block;
            color: var(--terminal-bright);
            text-decoration: none;
            border-bottom: 1px solid var(--terminal-bright);
            padding-bottom: 2px;
            transition: all 0.3s ease;
        }
        .download-link:hover { color: #fff; border-color: #fff; text-shadow: 0 0 10px #fff; }
    </style>
</head>
<body>
    <div class="book-container">
        <div class="header">
            <h1>Aventuras Fantásticas</h1>
            <div class="subtitle">SISTEMA DE AVENTURA IA</div>
        </div>
        <div class="content">
            <div id="setup-screen">
                <div class="section">
                    <h2 class="section-title">Configuração do Sistema</h2>
                    <div class="form-group">
                        <label for="llm-type">Modelo de IA</label>
                        <select id="llm-type">
                            <option value="ollama">Ollama (Local)</option>
                            <option value="openai">OpenAI API</option>
                            <option value="anthropic">Anthropic API</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="llm-model">Modelo Específico</label>
                        <input type="text" id="llm-model" placeholder="Ex: llama3.2, gpt-4o-mini, claude-sonnet-4-20250514">
                    </div>
                    <div class="form-group hidden" id="api-key-group">
                        <label for="api-key">API Key</label>
                        <input type="password" id="api-key" placeholder="Sua API key">
                    </div>
                </div>
                <div class="section">
                    <h2 class="section-title">Parâmetros da Aventura</h2>
                    <div class="form-group">
                        <label for="narrative-style">Estilo Narrativo</label>
                        <input type="text" id="narrative-style" value="épico e descritivo" placeholder="Ex: épico e descritivo, humorístico, sombrio">
                    </div>
                    <div class="form-group">
                        <label for="era">Época</label>
                        <input type="text" id="era" value="fantasia medieval" placeholder="Ex: fantasia medieval, cyberpunk, era vitoriana">
                    </div>
                    <div class="form-group">
                        <label for="context">Contexto</label>
                        <textarea id="context" placeholder="Ex: Um reino em guerra contra forças das trevas">Um reino em guerra contra forças das trevas</textarea>
                    </div>
                    <div class="form-group">
                        <label for="protagonist">Protagonista</label>
                        <textarea id="protagonist" placeholder="Descreva seu personagem">Um jovem aventureiro em busca de glória e fortuna</textarea>
                    </div>
                    <div class="form-group">
                        <label for="characters">Personagens e Criaturas</label>
                        <textarea id="characters" placeholder="Que tipos de personagens e criaturas habitam este mundo?">Magos sábios, guerreiros corajosos, dragões ancestrais e criaturas místicas</textarea>
                    </div>
                    <button class="btn" onclick="startAdventure()">Iniciar Aventura</button>
                </div>
            </div>
            <div id="game-screen" class="hidden">
                <div class="status-bar">
                    <div class="round-counter">RODADA <span id="current-round">1</span>/20</div>
                    <div>SESSÃO: <span id="session-id">-</span></div>
                </div>
                <div class="section">
                    <div class="narrative" id="narrative-text"></div>
                </div>
                <div class="section" id="options-section">
                    <h2 class="section-title">Opções Disponíveis</h2>
                    <div class="options" id="options-container"></div>
                    <div class="custom-action">
                        <label for="custom-input">Comando Customizado:</label>
                        <input type="text" id="custom-input" placeholder="Digite sua ação...">
                        <button class="btn mt-2" onclick="submitCustomAction()">Executar Comando</button>
                    </div>
                </div>
                <div class="section hidden" id="final-section">
                    <h2 class="section-title">Fim da Transmissão</h2>
                    <div id="log-download" class="success-msg"></div>
                </div>
            </div>
            <div id="loading-screen" class="hidden">
                <div class="loading">
                    <div class="spinner"></div>
                    <p>PROCESSANDO DADOS...</p>
                </div>
            </div>
        </div>
        <div class="footer">
            RPG LLM ADVENTURE • TERMINAL v1.0 • 1984
        </div>
    </div>
    <script src="/app.js"></script>
</body>
</html>
